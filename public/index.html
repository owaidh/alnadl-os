<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alnadl Hospitality OS</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14110E">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- UX-0 corrective round: this is genuinely production chrome (brand,
     language toggle, session/login status), rendered by app.js's
     renderTopBar(). Nothing demo-specific is rendered into it in any
     environment; see public/app.js. -->
<div class="appbar" id="appbar"></div>
<div id="app"></div>
<script src="/app.js"></script>
<!--DEV-ONLY-->
<script src="/dev-tools.js"></script>
<!--/DEV-ONLY-->
<script>
  // App.boot() runs only after every prior <script> tag above has fully
  // loaded and executed (script tags block/execute in document order) --
  // by this point window.AlnadlDevTools is either populated (dev.js was
  // served) or was never defined at all (production 404'd it, or this
  // whole block was stripped server-side), so every render() from here
  // sees the correct, final answer with zero race condition.
  App.boot();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
